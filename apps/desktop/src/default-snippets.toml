# Texture snippets - this file is yours. Edit it freely.
#
# Save with Ctrl+Enter (or :w in Vim mode). If something is wrong the errors are listed and the
# previous version stays active. The file syncs with your account like your documents do.
#
# [[snippet]]   One autocomplete and/or keyboard shortcut.
#     trigger      what you type to get it suggested, e.g. '\frac' or 'prob' (letters, digits, _ and *)
#     body         the text to insert. #{} is a spot Tab jumps to, #{text} one with placeholder text,
#                  and repeating #{1} fills several places at once
#     description  shown next to the suggestion (optional)
#     key          a keyboard shortcut, e.g. 'Mod-Alt-f' (Mod is Ctrl, or the Command key on a Mac).
#                  Needs Ctrl or Alt. Works while typing, not in Vim normal mode (optional)
#     group        heading in the Snippets list (optional)
#     A snippet needs a trigger, a key, or both.
# [[words]]     A list of plain commands suggested as prefix + word. Handy for \alpha, \beta, ...
#     name, list (words separated by spaces), prefix (default '\'), detail (optional)
# [environments] names  - offered after \begin{ ; choosing one inserts the whole \begin ... \end block
# [packages]     names  - offered after \usepackage{
#
# Tip: 'single quotes' keep backslashes literal, so LaTeX needs no escaping.
#      '''triple quotes''' can span several lines.

# ---- Word snippets ----

[[snippet]]
trigger = 'prob'
body = '''
\section*{Problem #{1}}
#{}'''
description = 'problem heading'
group = 'Word snippets'


[[snippet]]
trigger = 'sol'
body = '''
\begin{proof}[Solution]
	#{}
\end{proof}'''
description = 'solution block'
group = 'Word snippets'


[[snippet]]
trigger = 'ali'
body = '''
\begin{align*}
	#{} &= #{} \\
	&= #{}
\end{align*}'''
description = 'aligned equations'
group = 'Word snippets'


[[snippet]]
trigger = 'fig'
body = '''
\begin{figure}[h]
	\centering
	\includegraphics[width=#{0.8}\linewidth]{#{}}
	\caption{#{}}
\end{figure}'''
description = 'figure'
group = 'Word snippets'


[[snippet]]
trigger = 'mat'
body = '''
\begin{pmatrix}
	#{} & #{} \\
	#{} & #{}
\end{pmatrix}'''
description = '2×2 matrix'
group = 'Word snippets'


[[snippet]]
trigger = 'cas'
body = '''
\begin{cases}
	#{} & \text{if } #{} \\
	#{} & \text{otherwise}
\end{cases}'''
description = 'cases'
group = 'Word snippets'


