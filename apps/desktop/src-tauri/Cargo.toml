[package]
name = "appsdesktop"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "appsdesktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.4"
reqwest = { version = "0.13", features = ["json", "rustls"] }
base64 = "0.23.1"
# pinned: format_tex matches on the wording of tex-fmt's warnings
tex-fmt = { version = "=0.5.7", default-features = false }
merge = "0.2"
log = "0.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# unwind, not abort: format_tex catches panics from tex-fmt instead of taking the whole app down
panic = "unwind"
strip = true
