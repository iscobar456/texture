name: Release

# Manual only (macOS and Windows runners are billed at 10x and 2x). Builds just the macOS and Windows installers and
# attaches them to the release (draft or published) for the given tag. Linux and Android are built locally with
# scripts/release.sh, which creates the draft release; run this afterwards with the same tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the existing release to attach to, e.g. v0.3.0 (created as a draft if there is none)
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple silicon
            args: "--target aarch64-apple-darwin"
            rust-targets: aarch64-apple-darwin
          - os: macos-latest # Intel target, cross-compiled on Apple silicon
            args: "--target x86_64-apple-darwin"
            rust-targets: x86_64-apple-darwin
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc sign ("-"): no Developer ID, but Apple silicon refuses to run completely unsigned code ("damaged").
          APPLE_SIGNING_IDENTITY: "-"
          # Baked into the frontend at build time (the anon key is public by design).
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tag }}
          releaseName: Texture ${{ inputs.tag }}
          releaseDraft: true
          args: ${{ matrix.args }}
