name: Release

# Manual only (Windows runners are billed at 2x). Builds just the Windows installer and attaches it to the release
# (draft or published) for the given tag. Linux and Android are built locally with scripts/release.sh, which creates
# the draft release; macOS is built on a Mac with scripts/release-macos.sh. Run this afterwards with the same tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the existing release to attach to, e.g. v0.3.0 (created as a draft if there is none)
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked into the frontend at build time (the anon key is public by design).
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tag }}
          releaseName: Texture ${{ inputs.tag }}
          releaseDraft: true
          args: ${{ matrix.args }}
